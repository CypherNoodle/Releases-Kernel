name: Build Kernel and Create Release

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: 'Compilador + Linker'
        required: false
        type: choice
        options:
          - gcc-mold
          - gcc-ld
          - clang-lld
        default: gcc-mold
      prerelease:
        description: 'Marcar como pre-release'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 */5 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v6
        with:
          repository: CypherNoodle/linux-Sw1-011
          path: kernel-src
          fetch-depth: 32
          filter: blob:limit=1m

      - name: Setup tmpfs build directory
        run: |
          echo "🚀 Setting up tmpfs for faster I/O..."
          
          TOTAL_RAM=$(free -g | grep Mem | awk '{print $2}')
          AVAILABLE_RAM=$(free -g | grep Mem | awk '{print $7}')
          
          echo "Total RAM: ${TOTAL_RAM}GB"
          echo "Available RAM: ${AVAILABLE_RAM}GB"
          
          SOURCE_SIZE=$(du -sh --exclude=.git kernel-src | cut -f1)
          GIT_SIZE=$(du -sh kernel-src/.git 2>/dev/null | cut -f1)
          
          echo "Source code size (without .git): $SOURCE_SIZE"
          echo "Git history size: $GIT_SIZE"
          
          TMPFS_SIZE="6G"
          
          sudo mkdir -p /tmp/kernel-build
          sudo mount -t tmpfs -o size=$TMPFS_SIZE tmpfs /tmp/kernel-build
          sudo chown -R $USER:$USER /tmp/kernel-build
          
          echo "✅ tmpfs mounted at /tmp/kernel-build (${TMPFS_SIZE})"
          df -h /tmp/kernel-build
          
          echo ""
          echo "📦 Moving kernel source to tmpfs (keeping .git on disk)..."
          
          rsync -a --exclude='.git' kernel-src/ /tmp/kernel-build/
          
          mv kernel-src/.git kernel-git-backup
          
          rm -rf kernel-src
          
          ln -s /tmp/kernel-build kernel-src
          
          echo "✅ Kernel source now in RAM (tmpfs)"
          echo "✅ Git history preserved on disk for changelog"
          echo "Files in tmpfs: $(find /tmp/kernel-build -type f 2>/dev/null | wc -l)"
          echo ""
          df -h /tmp/kernel-build

      - name: Detect Kernel Version
        id: detect_version
        working-directory: kernel-src
        run: |
          KERNEL_VERSION=$(awk '
            /^VERSION = /      {v=$3}
            /^PATCHLEVEL = /   {p=$3}
            /^SUBLEVEL = /     {s=$3}
            /^EXTRAVERSION = / {e=$3}
            END {print v "." p "." s e}
          ' Makefile)
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
          echo "version=$KERNEL_VERSION" >> $GITHUB_OUTPUT
          echo "Detected kernel version: $KERNEL_VERSION"
          
          KERNEL_MAJOR_MINOR=$(awk '
            /^VERSION = /      {v=$3}
            /^PATCHLEVEL = /   {p=$3}
            END {print v "." p}
          ' Makefile)
          echo "KERNEL_MAJOR_MINOR=$KERNEL_MAJOR_MINOR" >> $GITHUB_ENV
          echo "major_minor=$KERNEL_MAJOR_MINOR" >> $GITHUB_OUTPUT
          echo "Kernel major.minor: $KERNEL_MAJOR_MINOR"
          
          KERNEL_MAJOR=$(awk '
            /^VERSION = /      {v=$3}
            END {print v}
          ' Makefile)
          echo "KERNEL_MAJOR=$KERNEL_MAJOR" >> $GITHUB_ENV
          echo "major=$KERNEL_MAJOR" >> $GITHUB_OUTPUT
          echo "Kernel major: $KERNEL_MAJOR"
          
          RELEASE_TAG="v${KERNEL_VERSION}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "Release will be tagged as: $RELEASE_TAG"

      - name: Determine toolchain variables
        id: toolchain
        run: |
          TOOLCHAIN="${{ github.event.inputs.toolchain }}"
          if [ -z "$TOOLCHAIN" ]; then
            TOOLCHAIN="gcc-mold"
          fi
          
          case "$TOOLCHAIN" in
            "gcc-mold")
              COMPILER="gcc"
              LINKER="mold"
              ;;
            "gcc-ld")
              COMPILER="gcc"
              LINKER="ld"
              ;;
            "clang-lld")
              COMPILER="clang"
              LINKER="lld"
              ;;
            *)
              echo "❌ Unknown toolchain: $TOOLCHAIN"
              exit 1
              ;;
          esac
          
          echo "COMPILER=$COMPILER" >> $GITHUB_ENV
          echo "LINKER=$LINKER" >> $GITHUB_ENV
          echo "compiler=$COMPILER" >> $GITHUB_OUTPUT
          echo "linker=$LINKER" >> $GITHUB_OUTPUT
          echo "Selected toolchain: $COMPILER + $LINKER"

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "${{ env.RELEASE_TAG }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️  Release ${{ env.RELEASE_TAG }} already exists!"
            
            # Determinar si debemos eliminar basado en prerelease
            PRERELEASE="${{ github.event.inputs.prerelease }}"
            if [ "$PRERELEASE" = "true" ]; then
              echo "action=skip" >> $GITHUB_OUTPUT
              echo "✅ Creating as prerelease - will NOT delete existing stable release"
            else
              echo "action=delete" >> $GITHUB_OUTPUT
              echo "⚠️  Creating stable release - existing release will be replaced"
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "action=create" >> $GITHUB_OUTPUT
            echo "✅ Release ${{ env.RELEASE_TAG }} will be created."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Delete old release assets
        if: steps.check_release.outputs.action == 'delete'
        run: |
          echo "🗑️  Deleting old release ${{ env.RELEASE_TAG }}..."
          
          gh release delete "${{ env.RELEASE_TAG }}" --yes --cleanup-tag 2>/dev/null || true
          
          echo "✅ Old release deleted, will create fresh one"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Restore APT cache
        uses: actions/cache/restore@v5
        id: apt-restore
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-v4
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          if [ -d ~/apt-cache ]; then
            echo "✅ Restoring APT cache..."
            sudo cp -r ~/apt-cache/* /var/cache/apt/archives/ 2>/dev/null || true
          fi
          
          sudo apt-get update -qq
          
          case "${{ env.COMPILER }}-${{ env.LINKER }}" in
            "gcc-mold")
              echo "📦 Installing GCC + mold..."
              sudo apt-get install -y -qq mold || echo "⚠️  mold not available"
              ;;
            "gcc-ld")
              echo "📦 Using GCC + ld (default, no extra packages)"
              ;;
            "clang-lld")
              echo "📦 Installing Clang + lld..."
              sudo apt-get install -y -qq clang llvm lld
              ;;
          esac
          
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc libssl-dev libelf-dev libncurses-dev \
            debhelper kmod cpio ccache libdw-dev \
            zstd pigz lz4
          
          echo "Saving APT cache..."
          mkdir -p ~/apt-cache
          sudo cp -r /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true
          
          echo ""
          echo "=== System Resources ==="
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h | grep Mem | awk '{print $2}')"
          echo "Disk space: $(df -h / | tail -1 | awk '{print $4}') free"
          echo ""
          echo "=== Toolchain Selected: ${{ env.COMPILER }} + ${{ env.LINKER }} ==="

      - name: Save APT cache
        uses: actions/cache/save@v5
        if: always() && steps.apt-restore.outputs.cache-hit != 'true'
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-v4

      - name: Restore ccache
        uses: actions/cache/restore@v5
        id: ccache-restore
        with:
          path: ~/.ccache
          key: ccache-${{ env.COMPILER }}-${{ runner.os }}-${{ env.KERNEL_MAJOR_MINOR }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.COMPILER }}-${{ runner.os }}-${{ env.KERNEL_MAJOR_MINOR }}-
            ccache-${{ env.COMPILER }}-${{ runner.os }}-${{ env.KERNEL_MAJOR }}.
            ccache-${{ env.COMPILER }}-${{ runner.os }}-

      - name: Restore kernel build tools
        uses: actions/cache/restore@v5
        id: kernel-tools-restore
        with:
          path: |
            kernel-src/scripts/basic/
            kernel-src/scripts/kconfig/
            kernel-src/scripts/mod/
            kernel-src/tools/objtool/
          key: kernel-tools-${{ runner.os }}-${{ env.KERNEL_MAJOR_MINOR }}
          restore-keys: |
            kernel-tools-${{ runner.os }}-${{ env.KERNEL_MAJOR }}.
            kernel-tools-${{ runner.os }}-

      - name: Restore generated .config
        uses: actions/cache/restore@v5
        id: config-restore
        with:
          path: kernel-src/.config
          key: config-${{ env.COMPILER }}-${{ runner.os }}-${{ env.KERNEL_MAJOR_MINOR }}-${{ hashFiles('kernel-src/arch/x86/configs/acer_sw1_011_defconfig') }}-v2
          restore-keys: |
            config-${{ env.COMPILER }}-${{ runner.os }}-${{ env.KERNEL_MAJOR_MINOR }}-

      - name: Check cache restoration
        run: |
          echo "=========================================="
          echo "BUILD INFORMATION"
          echo "=========================================="
          echo "Kernel Version: ${{ env.KERNEL_VERSION }}"
          echo "Release Tag: ${{ env.RELEASE_TAG }}"
          echo "Build Number: #${{ github.run_number }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Release Exists: ${{ steps.check_release.outputs.exists }}"
          echo "Config: acer_sw1_011_defconfig"
          echo "Toolchain: ${{ env.COMPILER }} + ${{ env.LINKER }}"
          echo ""
          echo "=========================================="
          echo "CACHE RESTORATION STATUS"
          echo "=========================================="
          
          echo "1️⃣  CCACHE (${{ env.COMPILER }}):"
          if [ -n "${{ steps.ccache-restore.outputs.cache-matched-key }}" ]; then
            echo "   ✅ RESTORED: ${{ steps.ccache-restore.outputs.cache-matched-key }}"
            if [ -d ~/.ccache ]; then
              SIZE=$(du -sh ~/.ccache 2>/dev/null | cut -f1)
              FILES=$(find ~/.ccache -type f 2>/dev/null | wc -l)
              echo "   📦 Size: $SIZE ($FILES files)"
              
              OBJECTS=$(find ~/.ccache -name "*.o" 2>/dev/null | wc -l)
              echo "   🔍 Cached objects: $OBJECTS"
            fi
          else
            echo "   ❌ NOT FOUND - First build will take ~50 minutes"
          fi
          echo ""
          
          echo "2️⃣  KERNEL .CONFIG (compiler-specific):"
          if [ "${{ steps.config-restore.outputs.cache-hit }}" == "true" ]; then
            echo "   ✅ RESTORED: Cached .config for ${{ env.COMPILER }}"
            if [ -f kernel-src/.config ]; then
              echo "   📅 Timestamp: $(stat -c %y kernel-src/.config 2>/dev/null || stat -f %Sm kernel-src/.config)"
            fi
          else
            echo "   ⚠️  WILL GENERATE: Fresh .config from defconfig for ${{ env.COMPILER }}"
            echo "   ⚠️  This WILL invalidate ccache entries (timestamps change)"
          fi
          echo ""
          
          echo "3️⃣  KERNEL BUILD TOOLS:"
          if [ -n "${{ steps.kernel-tools-restore.outputs.cache-matched-key }}" ]; then
            echo "   ✅ RESTORED: ${{ steps.kernel-tools-restore.outputs.cache-matched-key }}"
          else
            echo "   ❌ NOT FOUND"
          fi
          echo ""
          
          if [ -n "${{ steps.ccache-restore.outputs.cache-matched-key }}" ] && [ "${{ steps.config-restore.outputs.cache-hit }}" == "true" ]; then
            echo "⚡ EXCELLENT! Cache + Config cached - Build should take ~10-15 minutes"
          elif [ -n "${{ steps.ccache-restore.outputs.cache-matched-key }}" ]; then
            echo "⚠️  WARNING: Cache available BUT config will be regenerated"
            echo "   This changes .config timestamps and invalidates most ccache entries"
            echo "   Expected build time: ~40-50 minutes (almost like no cache)"
            echo "💡 Next build will be fast once .config is cached"
          else
            echo "⏰ NO CACHE - Full build will take ~50-60 minutes"
            echo "💡 Subsequent builds will be much faster!"
          fi
          echo "=========================================="

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=1
          ccache --set-config=sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers
          ccache --set-config=hash_dir=false
          
          ccache --set-config=temporary_dir=/tmp/kernel-build/ccache-tmp
          mkdir -p /tmp/kernel-build/ccache-tmp
          
          ccache --zero-stats
          
          echo "=== Ccache Configuration ==="
          ccache --show-config | grep -E "(max_size|compression|sloppiness|temporary_dir)"
          echo ""
          echo "=== Initial Statistics (zeroed) ==="
          ccache --show-stats
          echo ""
          echo "=== Verifying ccache is working ==="
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          which gcc
          which g++
          gcc --version | head -1

      - name: Prepare kernel configuration
        working-directory: kernel-src
        run: |
          echo "🔧 Configuring kernel for ${{ env.COMPILER }}..."
          
          if [ -f .config ] && [ "${{ steps.config-restore.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Using cached .config for ${{ env.COMPILER }} (preserves timestamps for ccache)"
            echo "   Skipping configuration to preserve cache validity"
            
            # Solo verificar que el .config es válido
            if make -s listnewconfig | grep -q '^CONFIG'; then
              echo "   ⚠️  WARNING: New config options detected:"
              make -s listnewconfig | head -10
              echo ""
              echo "   ℹ️  Consider adding these to acer_sw1_011_defconfig"
              echo "   ℹ️  Applying defaults for new options (non-interactive)..."
              
              # Usar olddefconfig en lugar de oldconfig - es completamente no-interactivo
              make -s olddefconfig > /dev/null 2>&1
              
              echo "   ⚠️  Cache may be partially invalidated due to new options"
            else
              echo "   ✅ No new config options - cache is 100% valid"
            fi
          else
            echo "⚙️  Generating fresh config from defconfig for ${{ env.COMPILER }}"
            
            if [ -f arch/x86/configs/acer_sw1_011_defconfig ]; then
              echo "✅ Using custom defconfig: acer_sw1_011_defconfig"
              make -s acer_sw1_011_defconfig
            else
              echo "❌ ERROR: acer_sw1_011_defconfig not found!"
              echo "Available defconfigs in arch/x86/configs/:"
              ls -1 arch/x86/configs/ | grep defconfig | head -10
              exit 1
            fi
            
            echo ""
            echo "⚙️  Applying build optimizations..."
            
            # Opciones generales de debug/optimización
            scripts/config --disable CONFIG_DEBUG_INFO
            scripts/config --disable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
            scripts/config --disable CONFIG_DEBUG_INFO_DWARF4
            scripts/config --disable CONFIG_DEBUG_INFO_DWARF5
            scripts/config --disable CONFIG_GDB_SCRIPTS
            scripts/config --set-val CONFIG_DEBUG_INFO_NONE y
            
            scripts/config --disable CONFIG_LOCALVERSION_AUTO
            
            scripts/config --enable CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE
            scripts/config --disable CONFIG_GCOV_KERNEL
            scripts/config --disable CONFIG_KCOV
            
            # Opciones específicas de Clang (prevenir preguntas interactivas)
            if [ "${{ env.COMPILER }}" = "clang" ]; then
              echo "⚙️  Applying Clang-specific options..."
              scripts/config --disable CONFIG_LTO_CLANG_FULL
              scripts/config --disable CONFIG_LTO_CLANG_THIN
              scripts/config --enable CONFIG_LTO_NONE
              scripts/config --disable CONFIG_CFI_CLANG
              scripts/config --enable CONFIG_RANDSTRUCT_NONE
              scripts/config --disable CONFIG_RANDSTRUCT_FULL
              scripts/config --disable CONFIG_RANDSTRUCT_PERFORMANCE
              scripts/config --disable CONFIG_KMSAN
            fi
            
            # Verificar si hay opciones nuevas después de aplicar scripts/config
            echo ""
            echo "⚙️  Checking for new config options..."
            
            if make -s listnewconfig | grep -q '^CONFIG'; then
              echo "   ⚠️  New config options found (not in defconfig):"
              make -s listnewconfig | head -10
              echo ""
              echo "   ℹ️  Applying defaults for new options (non-interactive)..."
              
              # olddefconfig es COMPLETAMENTE no-interactivo
              make -s olddefconfig > /dev/null 2>&1
            else
              echo "   ✅ No new config options - defconfig is complete!"
              echo "   ✅ Skipping olddefconfig (preserves timestamps)"
            fi
          fi
          
          echo ""
          echo "=== Configuration summary ==="
          echo "Config used: acer_sw1_011_defconfig"
          echo "Config cached: ${{ steps.config-restore.outputs.cache-hit }}"
          echo "Compiler: ${{ env.COMPILER }}"
          echo "Linker: ${{ env.LINKER }}"
          echo "Debug info: disabled"
          echo "Localversion auto: disabled"
          if [ "${{ env.COMPILER }}" = "clang" ]; then
            echo "Optimization: x86-64-v2 (generic optimization)"
            echo "LTO: disabled (explicitly set)"
            echo "CFI: disabled (explicitly set)"
            echo "AutoFDO: disabled (from defconfig)"
            echo "KMSAN: disabled (explicitly set)"
            echo "RANDSTRUCT: none (explicitly set)"
          else
            echo "Optimization: Intel x5-Z8300 (Silvermont)"
          fi

      - name: Build .deb kernel packages
        working-directory: kernel-src
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          
          if [ "${{ env.COMPILER }}" = "clang" ]; then
            export CC="ccache clang"
            export CXX="ccache clang++"
            export HOSTCC="clang"
            export HOSTCXX="clang++"
            export LLVM=1
            export LLVM_IAS=1
            
            # Optimizaciones para Silvermont con Clang
            # Base flags seguras
            CLANG_FLAGS="-O2 -march=x86-64-v2 -mtune=generic -pipe -fno-strict-aliasing -fno-common -mprefer-vector-width=128"
            
            # Solo agregar -fomit-frame-pointer si es compatible con la config
            FRAME_POINTER_BLOCKERS=""
            if grep -q "CONFIG_FRAME_POINTER=y" .config; then
              FRAME_POINTER_BLOCKERS="CONFIG_FRAME_POINTER=y"
            fi
            if grep -q "CONFIG_FUNCTION_TRACER=y" .config; then
              FRAME_POINTER_BLOCKERS="$FRAME_POINTER_BLOCKERS CONFIG_FUNCTION_TRACER=y"
            fi
            if grep -q "CONFIG_STACK_TRACER=y" .config; then
              FRAME_POINTER_BLOCKERS="$FRAME_POINTER_BLOCKERS CONFIG_STACK_TRACER=y"
            fi
            
            if [ -z "$FRAME_POINTER_BLOCKERS" ]; then
              CLANG_FLAGS="$CLANG_FLAGS -fomit-frame-pointer"
              echo "✅ Frame pointer optimization enabled (+2-3% performance)"
            else
              echo "⚠️  Skipping -fomit-frame-pointer due to: $FRAME_POINTER_BLOCKERS"
              echo "   These features require frame pointers to function correctly"
            fi
            
            export KCFLAGS="$CLANG_FLAGS"
            
            if [ "${{ env.LINKER }}" = "lld" ]; then
              export LDFLAGS="-fuse-ld=lld -Wl,--hash-style=gnu -Wl,--build-id=sha1"
              echo "✅ Using Clang + lld"
            fi
          else
            export CC="ccache gcc"
            export CXX="ccache g++"
            
            # Optimizaciones para Silvermont con GCC
            # Base flags seguras
            GCC_FLAGS="-O2 -march=silvermont -mtune=silvermont -pipe -fno-strict-aliasing -fno-common -mprefer-vector-width=128 -falign-functions=16 -falign-loops=16"
            
            # Solo agregar -fomit-frame-pointer si es compatible con la config
            FRAME_POINTER_BLOCKERS=""
            if grep -q "CONFIG_FRAME_POINTER=y" .config; then
              FRAME_POINTER_BLOCKERS="CONFIG_FRAME_POINTER=y"
            fi
            if grep -q "CONFIG_FUNCTION_TRACER=y" .config; then
              FRAME_POINTER_BLOCKERS="$FRAME_POINTER_BLOCKERS CONFIG_FUNCTION_TRACER=y"
            fi
            if grep -q "CONFIG_STACK_TRACER=y" .config; then
              FRAME_POINTER_BLOCKERS="$FRAME_POINTER_BLOCKERS CONFIG_STACK_TRACER=y"
            fi
            
            if [ -z "$FRAME_POINTER_BLOCKERS" ]; then
              GCC_FLAGS="$GCC_FLAGS -fomit-frame-pointer"
              echo "✅ Frame pointer optimization enabled (+2-3% performance)"
            else
              echo "⚠️  Skipping -fomit-frame-pointer due to: $FRAME_POINTER_BLOCKERS"
              echo "   These features require frame pointers to function correctly"
            fi
            
            export KCFLAGS="$GCC_FLAGS"
            
            if [ "${{ env.LINKER }}" = "mold" ]; then
              if command -v mold &> /dev/null; then
                export LDFLAGS="-fuse-ld=mold -Wl,--hash-style=gnu -Wl,--build-id=sha1"
                echo "✅ Using GCC + mold (ultra-fast)"
              else
                echo "⚠️  mold not available, using default ld"
              fi
            else
              echo "✅ Using GCC + ld (default)"
            fi
          fi
          
          export KCPPFLAGS="-D_FORTIFY_SOURCE=2"
          
          export KDOC_WERROR=0
          export LOCALVERSION=""
          
          # CRÍTICO: Forzar modo no-interactivo para make
          export DEBIAN_FRONTEND=noninteractive
          export DEBCONF_NONINTERACTIVE_SEEN=true
          export KCONFIG_ALLCONFIG=.config
          export KCONFIG_NOTIMESTAMP=1
          
          # CRÍTICO: Prevenir que make bindeb-pkg llame a oldconfig
          # Forzar que use olddefconfig en lugar de oldconfig
          export KBUILD_BUILD_VERSION=1
          
          NCPUS=$(nproc)
          JOBS=$((NCPUS + 2))
          
          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="
          if [ "${{ env.COMPILER }}" = "clang" ]; then
            echo "Compiler: $(clang --version | head -1)"
            echo "Target Arch: x86-64-v2 (generic optimization)"
          else
            echo "Compiler: $(gcc --version | head -1)"
            echo "Target Arch: Intel x5-Z8300 (Silvermont)"
          fi
          echo "Ccache: $(ccache --version | head -1)"
          echo "Linker: ${{ env.LINKER }}"
          echo "CPU Cores: $NCPUS"
          echo "Parallel Jobs: $JOBS"
          echo "Kernel Version: ${{ env.KERNEL_VERSION }}"
          echo "Interactive Mode: DISABLED (DEBIAN_FRONTEND=noninteractive)"
          echo "=========================================="
          echo ""
          
          START_TIME=$(date +%s)
          
          echo "🔨 Starting kernel compilation..."
          
          # CRÍTICO: Asegurar que el .config esté completamente resuelto ANTES de bindeb-pkg
          # bindeb-pkg puede llamar a scripts de configuración internamente
          echo "🔧 Pre-resolving config to prevent interactive prompts during build..."
          make -s olddefconfig > /dev/null 2>&1
          
          # Verificar que no hay opciones pendientes
          if make -s listnewconfig 2>/dev/null | grep -q '^CONFIG'; then
            echo "⚠️  WARNING: Still has new config options, forcing resolution..."
            make -s olddefconfig > /dev/null 2>&1
          fi
          
          echo "✅ Config fully resolved, starting package build..."
          echo ""
          
          # Usar yes como pipe para responder automáticamente a cualquier pregunta
          yes "" 2>/dev/null | make -s -j$JOBS \
            KERNELRELEASE=${{ env.KERNEL_VERSION }} \
            KDEB_PKGVERSION=${{ env.KERNEL_VERSION }}-1 \
            KDEB_SOURCENAME=linux-custom \
            KDEB_COMPRESS=xz \
            INSTALL_MOD_STRIP=1 \
            CONFIG_SHELL=/bin/bash \
            KCONFIG_NOTIMESTAMP=1 \
            KCONFIG_ALLCONFIG=$(pwd)/.config \
            bindeb-pkg 2>&1 | tee build.log || {
              # Si falla, intentar sin yes (fallback)
              echo "⚠️  Build with 'yes' failed, retrying without pipe..."
              make -s -j$JOBS \
                KERNELRELEASE=${{ env.KERNEL_VERSION }} \
                KDEB_PKGVERSION=${{ env.KERNEL_VERSION }}-1 \
                KDEB_SOURCENAME=linux-custom \
                KDEB_COMPRESS=xz \
                INSTALL_MOD_STRIP=1 \
                CONFIG_SHELL=/bin/bash \
                KCONFIG_NOTIMESTAMP=1 \
                KCONFIG_ALLCONFIG=$(pwd)/.config \
                bindeb-pkg 2>&1 | tee -a build.log
            }
          
          END_TIME=$(date +%s)
          BUILD_TIME=$((END_TIME - START_TIME))
          BUILD_MIN=$((BUILD_TIME / 60))
          BUILD_SEC=$((BUILD_TIME % 60))
          
          echo ""
          echo "=========================================="
          echo "✅ BUILD COMPLETED SUCCESSFULLY!"
          echo "=========================================="
          echo "Build Time: ${BUILD_MIN} minutes ${BUILD_SEC} seconds"
          echo "=========================================="
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
          
          echo ""
          echo "📦 Generated .deb packages:"
          ls -lh ../*.deb

      - name: Show ccache statistics
        if: always()
        run: |
          echo "=========================================="
          echo "CCACHE FINAL STATISTICS"
          echo "=========================================="
          ccache --show-stats
          echo ""
          
          STATS=$(ccache --show-stats)
          
          CACHE_HITS=$(echo "$STATS" | grep -i "hits:" | grep -oE '[0-9]+' | head -1 || echo "0")
          CACHE_MISS=$(echo "$STATS" | grep -i "misses:" | grep -oE '[0-9]+' | head -1 || echo "0")
          
          if [ "$CACHE_HITS" = "0" ]; then
            DIRECT=$(echo "$STATS" | grep -iE "(direct|cache hit \(direct\))" | grep -oE '[0-9]+' | head -1 || echo "0")
            PREPROC=$(echo "$STATS" | grep -iE "(preprocessed|cache hit \(preprocessed\))" | grep -oE '[0-9]+' | head -1 || echo "0")
            CACHE_HITS=$((DIRECT + PREPROC))
          fi
          
          if [ "$CACHE_MISS" = "0" ]; then
            CACHE_MISS=$(echo "$STATS" | grep -iE "(cache miss|misses)" | grep -oE '[0-9]+' | head -1 || echo "0")
          fi
          
          TOTAL=$((CACHE_HITS + CACHE_MISS))
          
          echo "📊 Compilation Statistics:"
          echo "   Cache hits: $CACHE_HITS"
          echo "   Cache misses: $CACHE_MISS"
          echo "   Total compilations: $TOTAL"
          
          if [ $TOTAL -gt 0 ]; then
            HIT_RATE=$(awk "BEGIN {printf \"%.1f\", ($CACHE_HITS * 100) / $TOTAL}")
            echo "   Cache hit rate: ${HIT_RATE}%"
            echo ""
            
            if (( $(echo "$HIT_RATE > 80" | bc -l) )); then
              echo "🎉 EXCELLENT! Cache provided massive speed improvement!"
              echo "   Build was ~5x faster than a clean build."
            elif (( $(echo "$HIT_RATE > 50" | bc -l) )); then
              echo "✅ GOOD cache performance."
              echo "   Build was ~3x faster than a clean build."
            elif (( $(echo "$HIT_RATE > 20" | bc -l) )); then
              echo "⚠️  MODERATE cache usage."
              echo "   Build was ~2x faster than a clean build."
            else
              echo "📝 LOW cache usage - this was close to a full rebuild."
              echo "   Next build will be much faster!"
            fi
          else
            echo ""
            echo "⚠️  No compilation statistics available."
            echo "This might be the first build or ccache is not working properly."
          fi
          
          FINAL_SIZE=$(du -sh ~/.ccache 2>/dev/null | cut -f1 || echo "unknown")
          echo ""
          echo "💾 Final cache size: $FINAL_SIZE"
          echo ""
          echo "=========================================="
          echo "DEBUG: Build duration analysis"
          echo "=========================================="
          echo "⏱️  Total build time: ${{ env.BUILD_TIME }} seconds ($((${{ env.BUILD_TIME }} / 60)) min)"
          echo ""
          if [ "${{ env.BUILD_TIME }}" -gt 7200 ]; then
            echo "🚨 CRITICAL: Build took over 2 hours!"
            echo "   Normal build should be 45-55 minutes"
            echo "   Possible issues:"
            echo "   1. ccache not working (check stats above)"
            echo "   2. Debug symbols enabled"
            echo "   3. LTO accidentally enabled"
            echo "   4. Single-threaded compilation"
            echo ""
            echo "🔍 Checking configuration..."
            cd kernel-src
            echo "   LTO config:"
            grep "CONFIG_LTO" .config || echo "   No LTO config found"
            echo ""
            echo "   Debug config:"
            grep "CONFIG_DEBUG_INFO" .config || echo "   No DEBUG_INFO config found"
          fi
          echo "=========================================="

      - name: Save ccache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: ~/.ccache
          key: ccache-${{ env.COMPILER }}-${{ runner.os }}-${{ env.KERNEL_MAJOR_MINOR }}-${{ github.run_id }}

      - name: Save kernel build tools
        uses: actions/cache/save@v5
        if: always() && steps.kernel-tools-restore.outputs.cache-hit != 'true'
        with:
          path: |
            kernel-src/scripts/basic/
            kernel-src/scripts/kconfig/
            kernel-src/scripts/mod/
            kernel-src/tools/objtool/
          key: kernel-tools-${{ runner.os }}-${{ env.KERNEL_MAJOR_MINOR }}

      - name: Save generated .config
        uses: actions/cache/save@v5
        if: always() && steps.config-restore.outputs.cache-hit != 'true'
        with:
          path: kernel-src/.config
          key: config-${{ env.COMPILER }}-${{ runner.os }}-${{ env.KERNEL_MAJOR_MINOR }}-${{ hashFiles('kernel-src/arch/x86/configs/acer_sw1_011_defconfig') }}-v2

      - name: Save build metrics
        if: always()
        run: |
          {
            echo "=========================================="
            echo "BUILD METRICS"
            echo "=========================================="
            echo "Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo "Kernel Version: ${{ env.KERNEL_VERSION }}"
            echo "Build Number: #${{ github.run_number }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }}"
            echo "Toolchain: ${{ env.COMPILER }} + ${{ env.LINKER }}"
            echo "Build Time: ${{ env.BUILD_TIME }} seconds ($((${{ env.BUILD_TIME }} / 60))m $((${{ env.BUILD_TIME }} % 60))s)"
            echo ""
            echo "=== Cache Information ==="
            echo "ccache restored from: ${{ steps.ccache-restore.outputs.cache-matched-key }}"
            echo "tools restored from: ${{ steps.kernel-tools-restore.outputs.cache-matched-key }}"
            echo ""
            echo "=== Ccache Statistics ==="
            ccache --show-stats 2>/dev/null || echo "ccache stats not available"
            echo "=========================================="
          } > build-metrics.txt

      - name: Generate CHANGELOG
        run: |
          echo "=========================================="
          echo "GENERATING CHANGELOG"
          echo "=========================================="
          echo "Current directory: $(pwd)"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo ""
          
          # Debug: Mostrar estructura de directorios
          echo "📂 Directory structure:"
          echo "Workspace contents:"
          ls -la "$GITHUB_WORKSPACE/" | head -20
          echo ""
          echo "kernel-src type:"
          file "$GITHUB_WORKSPACE/kernel-src" || echo "kernel-src not found"
          echo ""
          
          # Verificar que existe kernel-git-backup
          if [ -d "$GITHUB_WORKSPACE/kernel-git-backup" ]; then
            echo "✅ Found kernel-git-backup at: $GITHUB_WORKSPACE/kernel-git-backup"
            echo "   Size: $(du -sh "$GITHUB_WORKSPACE/kernel-git-backup" 2>/dev/null | cut -f1)"
            
            # Copiar .git a un directorio temporal EN EL WORKSPACE (no en /tmp)
            echo ""
            echo "📦 Creating temporary git directory..."
            TEMP_GIT_DIR="$GITHUB_WORKSPACE/temp-git-for-changelog"
            mkdir -p "$TEMP_GIT_DIR"
            
            # Copiar .git
            cp -r "$GITHUB_WORKSPACE/kernel-git-backup" "$TEMP_GIT_DIR/.git"
            
            cd "$TEMP_GIT_DIR"
            echo "Working from: $(pwd)"
            
            # Generar CHANGELOG directamente en el workspace usando ruta absoluta
            echo ""
            echo "📝 Generating CHANGELOG with git history..."
            {
              echo "# Linux Kernel ${{ env.KERNEL_VERSION }} - Build Release"
              echo ""
              echo "## Build Information"
              echo ""
              echo "- **Kernel Version:** ${{ env.KERNEL_VERSION }}"
              echo "- **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
              echo "- **Build Time:** $((${{ env.BUILD_TIME }} / 60)) minutes $((${{ env.BUILD_TIME }} % 60)) seconds"
              echo "- **Toolchain:** ${{ env.COMPILER }} + ${{ env.LINKER }}"
              if [ "${{ env.COMPILER }}" = "gcc" ]; then
                echo "- **Target Platform:** Intel x5-Z8300 (Silvermont)"
                echo "- **Compiler Flags:** -march=silvermont -mtune=silvermont"
              else
                echo "- **Target Platform:** x86-64-v2 (generic)"
                echo "- **Compiler Flags:** -march=x86-64-v2 -mtune=generic"
              fi
              echo ""
              echo "## Installation"
              echo ""
              echo "\`\`\`bash"
              echo "# Download all .deb files"
              echo "# Install with:"
              echo "sudo dpkg -i linux-*.deb"
              echo ""
              echo "# Reboot to use the new kernel"
              echo "sudo reboot"
              echo "\`\`\`"
              echo ""
              echo "## Package Contents"
              echo ""
              echo "- \`linux-image-*\` - Kernel image"
              echo "- \`linux-headers-*\` - Kernel headers for module compilation"
              echo "- \`linux-libc-dev-*\` - Kernel headers for userspace"
              echo ""
              echo "## Recent Kernel Changes (Last 30 commits)"
              echo ""
              git log --reverse -n 30 --pretty=format:"- \`%h\` %s (%an, %ar)" 2>/dev/null || echo "- No git history available"
              echo ""
              echo ""
              echo "## Verification"
              echo ""
              echo "All packages are checksummed in \`SHA256SUMS.txt\`. Verify with:"
              echo ""
              echo "\`\`\`bash"
              echo "sha256sum -c SHA256SUMS.txt"
              echo "\`\`\`"
            } > "$GITHUB_WORKSPACE/CHANGELOG.md"
            
            # Limpiar directorio temporal
            cd "$GITHUB_WORKSPACE"
            rm -rf "$TEMP_GIT_DIR"
            echo "✅ Cleaned up temporary git directory"
            
          else
            echo "⚠️  kernel-git-backup not found at: $GITHUB_WORKSPACE/kernel-git-backup"
            echo "Generating CHANGELOG without git history..."
            
            # Generar CHANGELOG sin historial git
            {
              echo "# Linux Kernel ${{ env.KERNEL_VERSION }} - Build Release"
              echo ""
              echo "## Build Information"
              echo ""
              echo "- **Kernel Version:** ${{ env.KERNEL_VERSION }}"
              echo "- **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
              echo "- **Build Time:** $((${{ env.BUILD_TIME }} / 60)) minutes $((${{ env.BUILD_TIME }} % 60)) seconds"
              echo "- **Toolchain:** ${{ env.COMPILER }} + ${{ env.LINKER }}"
              if [ "${{ env.COMPILER }}" = "gcc" ]; then
                echo "- **Target Platform:** Intel x5-Z8300 (Silvermont)"
                echo "- **Compiler Flags:** -march=silvermont -mtune=silvermont"
              else
                echo "- **Target Platform:** x86-64-v2 (generic)"
                echo "- **Compiler Flags:** -march=x86-64-v2 -mtune=generic"
              fi
              echo ""
              echo "## Installation"
              echo ""
              echo "\`\`\`bash"
              echo "# Download all .deb files"
              echo "# Install with:"
              echo "sudo dpkg -i linux-*.deb"
              echo ""
              echo "# Reboot to use the new kernel"
              echo "sudo reboot"
              echo "\`\`\`"
              echo ""
              echo "## Package Contents"
              echo ""
              echo "- \`linux-image-*\` - Kernel image"
              echo "- \`linux-headers-*\` - Kernel headers for module compilation"
              echo "- \`linux-libc-dev-*\` - Kernel headers for userspace"
              echo ""
              echo "## Verification"
              echo ""
              echo "All packages are checksummed in \`SHA256SUMS.txt\`. Verify with:"
              echo ""
              echo "\`\`\`bash"
              echo "sha256sum -c SHA256SUMS.txt"
              echo "\`\`\`"
            } > "$GITHUB_WORKSPACE/CHANGELOG.md"
          fi
          
          echo ""
          echo "=========================================="
          echo "VERIFYING CHANGELOG"
          echo "=========================================="
          
          # Verificar que CHANGELOG.md existe
          if [ -f "$GITHUB_WORKSPACE/CHANGELOG.md" ]; then
            echo "✅ CHANGELOG.md generated successfully!"
            echo "   Location: $GITHUB_WORKSPACE/CHANGELOG.md"
            echo "   Size: $(wc -l < "$GITHUB_WORKSPACE/CHANGELOG.md") lines"
            echo "   File size: $(du -h "$GITHUB_WORKSPACE/CHANGELOG.md" | cut -f1)"
            echo ""
            echo "First 10 lines:"
            head -10 "$GITHUB_WORKSPACE/CHANGELOG.md"
            echo "=========================================="
          else
            echo "❌ ERROR: CHANGELOG.md not found!"
            echo "   Expected location: $GITHUB_WORKSPACE/CHANGELOG.md"
            echo ""
            echo "Searching for CHANGELOG.md in workspace..."
            find "$GITHUB_WORKSPACE" -name "CHANGELOG.md" -type f 2>/dev/null || echo "No CHANGELOG.md found anywhere"
            echo ""
            echo "Contents of workspace root:"
            ls -la "$GITHUB_WORKSPACE/"
            exit 1
          fi

      - name: Collect release files
        run: |
          mkdir -p release
          
          echo "🔍 Collecting release files..."
          echo "Working directory: $(pwd)"
          
          # Los .deb se generan en /tmp/ debido al tmpfs
          if ls /tmp/*.deb 1> /dev/null 2>&1; then
            cp /tmp/*.deb release/
            DEB_COUNT=$(ls release/*.deb 2>/dev/null | wc -l)
            echo "✅ Copied $DEB_COUNT .deb package(s)"
          else
            echo "❌ ERROR: No .deb files found in /tmp/"
            exit 1
          fi
          
          # Copiar paquetes Arch
          if ls arch-packages/*.pkg.tar.* 1> /dev/null 2>&1; then
            cp arch-packages/*.pkg.tar.* release/
            ARCH_COUNT=$(ls release/*.pkg.tar.* 2>/dev/null | wc -l)
            echo "✅ Copied $ARCH_COUNT Arch package(s)"
          else
            echo "⚠️  Warning: No Arch packages found"
          fi
          
          # Copiar CHANGELOG.md desde workspace root
          if [ -f "$GITHUB_WORKSPACE/CHANGELOG.md" ]; then
            cp "$GITHUB_WORKSPACE/CHANGELOG.md" release/
            echo "✅ Copied CHANGELOG.md"
          else
            echo "❌ ERROR: CHANGELOG.md not found in workspace"
            echo "Searching for CHANGELOG.md..."
            find "$GITHUB_WORKSPACE" -name "CHANGELOG.md" -type f 2>/dev/null || echo "No CHANGELOG found anywhere"
            exit 1
          fi
          
          # Copiar build-metrics.txt desde workspace root
          if [ -f "$GITHUB_WORKSPACE/build-metrics.txt" ]; then
            cp "$GITHUB_WORKSPACE/build-metrics.txt" release/
            echo "✅ Copied build-metrics.txt"
          else
            echo "⚠️  Warning: build-metrics.txt not found, skipping"
          fi
          
          # Generar checksums (separados por tipo)
          cd release
          
          # Checksums para .deb
          if ls *.deb 1> /dev/null 2>&1; then
            sha256sum *.deb > SHA256SUMS-deb.txt
            echo "✅ Generated SHA256SUMS-deb.txt"
          fi
          
          # Checksums para Arch packages
          if ls *.pkg.tar.* 1> /dev/null 2>&1; then
            sha256sum *.pkg.tar.* > SHA256SUMS-arch.txt
            echo "✅ Generated SHA256SUMS-arch.txt"
          fi
          
          # Checksums combinados
          sha256sum * 2>/dev/null | grep -v "SHA256SUMS" > SHA256SUMS.txt || true
          
          echo ""
          echo "=========================================="
          echo "RELEASE FILES PREPARED"
          echo "=========================================="
          ls -lh
          echo ""
          echo "📋 Debian Checksums:"
          cat SHA256SUMS-deb.txt 2>/dev/null || echo "No .deb packages"
          echo ""
          echo "📋 Arch Checksums:"
          cat SHA256SUMS-arch.txt 2>/dev/null || echo "No Arch packages"
          echo "=========================================="

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-${{ env.KERNEL_VERSION }}-build-${{ github.run_number }}
          path: |
            release/*.deb
            release/*.pkg.tar.*
            release/*.txt
            release/*.md
            kernel-src/build.log
            
      - name: Create or Update GitHub Release
        run: |
          echo "=========================================="
          echo "CREATING RELEASE"
          echo "=========================================="
          echo "Tag: ${{ env.RELEASE_TAG }}"
          
          # Determinar si es prerelease
          PRERELEASE_FLAG=""
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
            echo "Type: Pre-release"
            RELEASE_TITLE="Linux Kernel ${{ env.KERNEL_VERSION }} (Pre-release)"
          else
            PRERELEASE_FLAG="--latest"
            echo "Type: Stable release"
            RELEASE_TITLE="Linux Kernel ${{ env.KERNEL_VERSION }}"
          fi
          echo ""
          
          # Si ya existe y es prerelease, crear con sufijo diferente
          if [ "${{ steps.check_release.outputs.exists }}" = "true" ] && [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            # Agregar sufijo al tag para prerelease
            PRERELEASE_TAG="${{ env.RELEASE_TAG }}-pre-${{ github.run_number }}"
            echo "⚠️  Stable release exists, creating prerelease with tag: $PRERELEASE_TAG"
            
            gh release create "$PRERELEASE_TAG" \
              release/*.deb \
              release/*.pkg.tar.* \
              release/SHA256SUMS*.txt \
              release/build-metrics.txt \
              --title "$RELEASE_TITLE (Build #${{ github.run_number }})" \
              --notes-file release/CHANGELOG.md \
              $PRERELEASE_FLAG
          else
            gh release create "${{ env.RELEASE_TAG }}" \
              release/*.deb \
              release/*.pkg.tar.* \
              release/SHA256SUMS*.txt \
              release/build-metrics.txt \
              --title "$RELEASE_TITLE" \
              --notes-file release/CHANGELOG.md \
              $PRERELEASE_FLAG
          fi
          
          echo ""
          echo "✅ Release created successfully!"
          echo "=========================================="
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Build summary
        if: always()
        run: |
          echo "=========================================="
          echo "🎉 WORKFLOW COMPLETED"
          echo "=========================================="
          echo "Kernel Version: ${{ env.KERNEL_VERSION }}"
          echo "Release Tag: ${{ env.RELEASE_TAG }}"
          echo "Toolchain: ${{ env.COMPILER }} + ${{ env.LINKER }}"
          echo "Build Time: $((${{ env.BUILD_TIME }} / 60))m $((${{ env.BUILD_TIME }} % 60))s"
          echo ""
          echo "📦 Release URL:"
          echo "https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}"
          echo "=========================================="
