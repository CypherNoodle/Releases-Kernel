name: Build Kernel and Create Release

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: 'Compilador + Linker'
        required: false
        type: choice
        options:
          - gcc-mold
          - gcc-ld
          - clang-lld
        default: gcc-mold
      package_format:
        description: 'Formato de paquete a generar'
        required: false
        type: choice
        options:
          - deb
          - arch
          - ambos
        default: ambos
      config_source:
        description: 'Fuente de la configuración (.config)'
        required: false
        type: choice
        options:
          - sw1-011
          - .config
        default: sw1-011
      prerelease:
        description: 'Marcar como pre-release'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 */5 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v6
        with:
          repository: CypherNoodle/linux-Sw1-011
          path: kernel-src
          fetch-depth: 32
          filter: blob:limit=1m

      - name: Setup tmpfs build directory
        run: |
          echo "🚀 Configurando tmpfs..."
          sudo mkdir -p /tmp/kernel-build
          sudo mount -t tmpfs -o size=6G tmpfs /tmp/kernel-build
          sudo chown -R $USER:$USER /tmp/kernel-build
          rsync -a --exclude='.git' kernel-src/ /tmp/kernel-build/
          mv kernel-src/.git kernel-git-backup
          rm -rf kernel-src
          ln -s /tmp/kernel-build kernel-src

      - name: Detect Kernel Version
        id: detect_version
        working-directory: kernel-src
        run: |
          KERNEL_VERSION=$(awk '/^VERSION = / {v=$3} /^PATCHLEVEL = / {p=$3} /^SUBLEVEL = / {s=$3} /^EXTRAVERSION = / {e=$3} END {print v "." p "." s e}' Makefile)
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
          echo "KERNEL_MAJOR_MINOR=$(echo $KERNEL_VERSION | cut -d. -f1-2)" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${KERNEL_VERSION}" >> $GITHUB_ENV

      - name: Determine variables
        run: |
          TOOLCHAIN="${{ github.event.inputs.toolchain || 'gcc-mold' }}"
          case "$TOOLCHAIN" in
            "gcc-mold") echo "COMPILER=gcc" >> $GITHUB_ENV; echo "LINKER=mold" >> $GITHUB_ENV ;;
            "gcc-ld") echo "COMPILER=gcc" >> $GITHUB_ENV; echo "LINKER=ld" >> $GITHUB_ENV ;;
            "clang-lld") echo "COMPILER=clang" >> $GITHUB_ENV; echo "LINKER=lld" >> $GITHUB_ENV ;;
          esac
          echo "CONFIG_SOURCE=${{ github.event.inputs.config_source || 'sw1-011' }}" >> $GITHUB_ENV
          echo "PACKAGE_FORMAT=${{ github.event.inputs.package_format || 'deb' }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc libssl-dev libelf-dev libncurses-dev debhelper kmod cpio ccache libdw-dev zstd pigz lz4
          if [ "${{ env.COMPILER }}" = "clang" ]; then sudo apt-get install -y -qq clang llvm lld; fi
          if [ "${{ env.LINKER }}" = "mold" ]; then sudo apt-get install -y -qq mold || true; fi

      - name: Prepare kernel configuration
        working-directory: kernel-src
        run: |
          if [ "${{ env.CONFIG_SOURCE }}" == ".config" ]; then
            cp .config.x86_64 .config
          else
            make -s acer_sw1_011_defconfig
          fi
          
          scripts/config --disable CONFIG_DEBUG_INFO
          scripts/config --set-val CONFIG_DEBUG_INFO_NONE y
          make -s olddefconfig

          echo "🔍 Verificando opciones CRÍTICAS..."
          CRITICAL_MISSING=""
          for opt in CONFIG_INTEL_INT0002_VGPIO CONFIG_INTEL_SCU CONFIG_MMC_SDHCI_ACPI CONFIG_EXT4_FS CONFIG_PINCTRL_CHERRYVIEW; do
            grep -qE "^$opt=[ym]" .config || CRITICAL_MISSING="$CRITICAL_MISSING $opt"
          done
          
          if [ -n "$CRITICAL_MISSING" ]; then
            echo "❌ ERROR: Faltan opciones: $CRITICAL_MISSING"
            exit 1
          fi

      - name: Compile kernel
        working-directory: kernel-src
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          if [ "${{ env.COMPILER }}" = "clang" ]; then export CC="ccache clang" LLVM=1; else export CC="ccache gcc"; fi
          if [ "${{ env.LINKER }}" = "mold" ]; then export LDFLAGS="-fuse-ld=mold"; fi
          START_TIME=$(date +%s)
          make -j$(nproc) KERNELRELEASE=${{ env.KERNEL_VERSION }} bzImage modules
          echo "BUILD_TIME=$(($(date +%s) - START_TIME))" >> $GITHUB_ENV

      - name: Package .deb
        if: contains(env.PACKAGE_FORMAT, 'deb') || env.PACKAGE_FORMAT == 'ambos'
        working-directory: kernel-src
        run: make -j$(nproc) KERNELRELEASE=${{ env.KERNEL_VERSION }} KDEB_PKGVERSION=${{ env.KERNEL_VERSION }}-1 bindeb-pkg

      - name: Build Arch package
        if: contains(env.PACKAGE_FORMAT, 'arch') || env.PACKAGE_FORMAT == 'ambos'
        run: |
          SAFE_VERSION=$(echo "${{ env.KERNEL_VERSION }}" | tr '-' '_')
          STAGING="$GITHUB_WORKSPACE/arch-staging"
          PKGOUT="$GITHUB_WORKSPACE/arch-packages"
          mkdir -p "$STAGING/boot" "$PKGOUT"
          cp /tmp/kernel-build/arch/x86/boot/bzImage "$STAGING/boot/vmlinuz-${{ env.KERNEL_VERSION }}"
          make -C /tmp/kernel-build modules_install INSTALL_MOD_PATH="$STAGING/usr" INSTALL_MOD_STRIP=1 KERNELRELEASE=${{ env.KERNEL_VERSION }} -s
          printf "pkgname=linux-acer-sw1-011\npkgver=${SAFE_VERSION}\npkgrel=1\narch=('x86_64')\npackage() { cp -a /staging/. \"\${pkgdir}/\"; }\n" > "$PKGOUT/PKGBUILD"
          docker run --rm -v "$STAGING:/staging:ro" -v "$PKGOUT:/pkgout" archlinux:latest bash -c "pacman -Syu --noconfirm base-devel && useradd -m b && chown -R b /pkgout && cd /pkgout && su b -c 'makepkg --noconfirm --nodeps'"

      - name: Generate CHANGELOG
        run: |
          echo "# Linux Kernel ${{ env.KERNEL_VERSION }}" > CHANGELOG.md
          echo "- **Config:** ${{ env.CONFIG_SOURCE }}" >> CHANGELOG.md
          if [ -d "kernel-git-backup" ]; then git -C kernel-git-backup log --reverse -n 15 --pretty=format:"- %h %s" >> CHANGELOG.md; fi

      - name: Create GitHub Release
        run: |
          mkdir -p release_assets
          cp /tmp/*.deb release_assets/ 2>/dev/null || true
          cp arch-packages/*.pkg.tar.* release_assets/ 2>/dev/null || true
          
          # Se añade --repo para evitar el error de "not a git repository"
          gh release create "${{ env.RELEASE_TAG }}" release_assets/* \
            --repo ${{ github.repository }} \
            --title "Linux Kernel ${{ env.KERNEL_VERSION }} (${{ env.CONFIG_SOURCE }})" \
            --notes-file CHANGELOG.md \
            ${{ github.event.inputs.prerelease == 'true' && '--prerelease' || '--latest' }}
        env:
          GH_TOKEN: ${{ github.token }}
