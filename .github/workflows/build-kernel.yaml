name: Build Kernel and Create Release

on:
  workflow_dispatch:
    inputs:
      compiler:
        description: 'Compiler to use'
        required: false
        type: choice
        options:
          - gcc
          - clang
        default: gcc
      linker:
        description: 'Linker to use'
        required: false
        type: choice
        options:
          - mold
          - lld
          - ld
        default: mold
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 */5 * *'  # Ejecuta automáticamente cada 5 días a las 00:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necesario para crear releases
    steps:
      # ------------------------------------------------------------
      # Checkout kernel source (optimized)
      # ------------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v6
        with:
          repository: CypherNoodle/linux-Sw1-011
          path: kernel-src
          fetch-depth: 50
          filter: blob:limit=1m

      # ------------------------------------------------------------
      # Setup tmpfs for faster builds
      # ------------------------------------------------------------
      - name: Setup tmpfs build directory
        run: |
          echo "🚀 Setting up tmpfs for faster I/O..."
          
          # Verificar RAM disponible
          TOTAL_RAM=$(free -g | grep Mem | awk '{print $2}')
          AVAILABLE_RAM=$(free -g | grep Mem | awk '{print $7}')
          
          echo "Total RAM: ${TOTAL_RAM}GB"
          echo "Available RAM: ${AVAILABLE_RAM}GB"
          
          # Verificar tamaño del código fuente
          SOURCE_SIZE=$(du -sh --exclude=.git kernel-src | cut -f1)
          GIT_SIZE=$(du -sh kernel-src/.git 2>/dev/null | cut -f1)
          
          echo "Source code size (without .git): $SOURCE_SIZE"
          echo "Git history size: $GIT_SIZE"
          
          # Usar 4GB para tmpfs (suficiente para código sin .git)
          TMPFS_SIZE="4G"
          
          # Crear directorio tmpfs
          sudo mkdir -p /tmp/kernel-build
          sudo mount -t tmpfs -o size=$TMPFS_SIZE tmpfs /tmp/kernel-build
          sudo chown -R $USER:$USER /tmp/kernel-build
          
          echo "✅ tmpfs mounted at /tmp/kernel-build (${TMPFS_SIZE})"
          df -h /tmp/kernel-build
          
          # Estrategia: código fuente en tmpfs, .git en disco
          echo ""
          echo "📦 Moving kernel source to tmpfs (keeping .git on disk)..."
          
          # Copiar solo código fuente a tmpfs (sin .git)
          rsync -a --exclude='.git' kernel-src/ /tmp/kernel-build/
          
          # Guardar .git en una ubicación temporal en disco
          mv kernel-src/.git kernel-git-backup
          
          # Eliminar directorio original
          rm -rf kernel-src
          
          # Crear symlink a tmpfs
          ln -s /tmp/kernel-build kernel-src
          
          echo "✅ Kernel source now in RAM (tmpfs)"
          echo "✅ Git history preserved on disk for changelog"
          echo "Files in tmpfs: $(find /tmp/kernel-build -type f 2>/dev/null | wc -l)"
          echo ""
          df -h /tmp/kernel-build

      # ------------------------------------------------------------
      # Detect kernel version
      # ------------------------------------------------------------
      - name: Detect Kernel Version
        id: detect_version
        working-directory: kernel-src
        run: |
          # Extraer versión completa
          KERNEL_VERSION=$(awk '
            /^VERSION = /      {v=$3}
            /^PATCHLEVEL = /   {p=$3}
            /^SUBLEVEL = /     {s=$3}
            /^EXTRAVERSION = / {e=$3}
            END {print v "." p "." s e}
          ' Makefile)
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
          echo "version=$KERNEL_VERSION" >> $GITHUB_OUTPUT
          echo "Detected kernel version: $KERNEL_VERSION"
          
          # Extraer solo VERSION y PATCHLEVEL para cache keys (ej: 6.19)
          KERNEL_MAJOR_MINOR=$(awk '
            /^VERSION = /      {v=$3}
            /^PATCHLEVEL = /   {p=$3}
            END {print v "." p}
          ' Makefile)
          echo "KERNEL_MAJOR_MINOR=$KERNEL_MAJOR_MINOR" >> $GITHUB_ENV
          echo "major_minor=$KERNEL_MAJOR_MINOR" >> $GITHUB_OUTPUT
          echo "Kernel major.minor: $KERNEL_MAJOR_MINOR"
          
          # Extraer solo VERSION para cache keys más permisivos (ej: 6)
          KERNEL_MAJOR=$(awk '
            /^VERSION = /      {v=$3}
            END {print v}
          ' Makefile)
          echo "KERNEL_MAJOR=$KERNEL_MAJOR" >> $GITHUB_ENV
          echo "major=$KERNEL_MAJOR" >> $GITHUB_OUTPUT
          echo "Kernel major: $KERNEL_MAJOR"
          
          # Tag para la release
          RELEASE_TAG="v${KERNEL_VERSION}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "Release will be tagged as: $RELEASE_TAG"

      # ------------------------------------------------------------
      # Check if release already exists
      # ------------------------------------------------------------
      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "${{ env.RELEASE_TAG }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️  Release ${{ env.RELEASE_TAG }} already exists!"
            echo "Existing assets will be replaced with new build."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Release ${{ env.RELEASE_TAG }} will be created."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      # ------------------------------------------------------------
      # Delete existing release assets if release exists
      # ------------------------------------------------------------
      - name: Delete old release assets
        if: steps.check_release.outputs.exists == 'true'
        run: |
          echo "🗑️  Deleting old assets from release ${{ env.RELEASE_TAG }}..."
          
          # Borrar todos los assets en una operación
          gh release delete "${{ env.RELEASE_TAG }}" --yes --cleanup-tag 2>/dev/null || true
          
          echo "✅ Old release deleted, will create fresh one"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      # ------------------------------------------------------------
      # Restore APT cache
      # ------------------------------------------------------------
      - name: Restore APT cache
        uses: actions/cache/restore@v5
        id: apt-restore
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-v4
          restore-keys: |
            apt-${{ runner.os }}-

      # ------------------------------------------------------------
      # Install build dependencies
      # ------------------------------------------------------------
      - name: Install build dependencies
        run: |
          if [ -d ~/apt-cache ]; then
            echo "✅ Restoring APT cache..."
            sudo cp -r ~/apt-cache/* /var/cache/apt/archives/ 2>/dev/null || true
          fi
          
          # Instalar dependencias en paralelo
          sudo apt-get update -qq
          
          LINKER="${{ github.event.inputs.linker }}"
          if [ -z "$LINKER" ]; then
            LINKER="mold"
          fi
          
          # Instalar linker seleccionado
          if [ "$LINKER" = "mold" ]; then
            echo "📦 Installing mold (ultra-fast linker)..."
            sudo apt-get install -y -qq mold || echo "⚠️  mold not available, will use fallback"
          elif [ "$LINKER" = "lld" ]; then
            echo "📦 Installing lld (LLVM linker)..."
            sudo apt-get install -y -qq lld-18 || sudo apt-get install -y -qq lld
          fi
          # ld viene incluido en binutils (ya instalado)
          
          # Instalar dependencias core
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bc libssl-dev libelf-dev libncurses-dev \
            debhelper kmod cpio ccache libdw-dev \
            zstd pigz lz4
          
          # Si se seleccionó Clang, instalarlo
          COMPILER="${{ github.event.inputs.compiler }}"
          if [ "$COMPILER" = "clang" ]; then
            echo "📦 Installing Clang/LLVM toolchain..."
            sudo apt-get install -y -qq clang-18 llvm-18
          fi
          
          echo "Saving APT cache..."
          mkdir -p ~/apt-cache
          sudo cp -r /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true
          
          echo ""
          echo "=== System Resources ==="
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h | grep Mem | awk '{print $2}')"
          echo "Disk space: $(df -h / | tail -1 | awk '{print $4}') free"
          echo ""
          echo "=== Toolchain Selected ==="
          
          # Mostrar compilador seleccionado
          if [ -z "$COMPILER" ] || [ "$COMPILER" = "gcc" ]; then
            echo "Compiler: GCC $(gcc --version | head -1)"
          else
            echo "Compiler: Clang $(clang-18 --version | head -1)"
          fi
          
          # Mostrar linker seleccionado
          if [ "$LINKER" = "mold" ] && command -v mold &> /dev/null; then
            echo "Linker: mold $(mold --version | head -1)"
          elif [ "$LINKER" = "lld" ] && command -v ld.lld &> /dev/null; then
            echo "Linker: lld $(ld.lld --version | head -1)"
          else
            echo "Linker: GNU ld $(ld --version | head -1)"
          fi

      # ------------------------------------------------------------
      # Save APT cache
      # ------------------------------------------------------------
      - name: Save APT cache
        uses: actions/cache/save@v5
        if: always() && steps.apt-restore.outputs.cache-hit != 'true'
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-v4

      # ------------------------------------------------------------
      # Restore ccache
      # ------------------------------------------------------------
      - name: Restore ccache
        uses: actions/cache/restore@v5
        id: ccache-restore
        with:
          path: ~/.ccache
          # Cache incluye compilador y linker en la key
          key: ccache-${{ github.event.inputs.compiler || 'gcc' }}-${{ github.event.inputs.linker || 'mold' }}-${{ runner.os }}-${{ env.KERNEL_MAJOR_MINOR }}
          restore-keys: |
            ccache-${{ github.event.inputs.compiler || 'gcc' }}-${{ github.event.inputs.linker || 'mold' }}-${{ runner.os }}-${{ env.KERNEL_MAJOR }}.
            ccache-${{ github.event.inputs.compiler || 'gcc' }}-${{ github.event.inputs.linker || 'mold' }}-${{ runner.os }}-
            ccache-${{ github.event.inputs.compiler || 'gcc' }}-${{ runner.os }}-

      # ------------------------------------------------------------
      # Restore kernel build tools
      # ------------------------------------------------------------
      - name: Restore kernel build tools
        uses: actions/cache/restore@v5
        id: kernel-tools-restore
        with:
          path: |
            kernel-src/scripts/basic/
            kernel-src/scripts/kconfig/
            kernel-src/scripts/mod/
            kernel-src/tools/objtool/
          key: kernel-tools-${{ runner.os }}-${{ env.KERNEL_MAJOR_MINOR }}
          restore-keys: |
            kernel-tools-${{ runner.os }}-${{ env.KERNEL_MAJOR }}.
            kernel-tools-${{ runner.os }}-

      # ------------------------------------------------------------
      # Restore .config generado
      # ------------------------------------------------------------
      - name: Restore generated .config
        uses: actions/cache/restore@v5
        id: config-restore
        with:
          path: kernel-src/.config
          key: config-${{ runner.os }}-${{ env.KERNEL_MAJOR_MINOR }}-${{ hashFiles('kernel-src/arch/x86/configs/acer_sw1_011_defconfig') }}
          restore-keys: |
            config-${{ runner.os }}-${{ env.KERNEL_MAJOR_MINOR }}-

      # ------------------------------------------------------------
      # Check cache restoration
      # ------------------------------------------------------------
      - name: Check cache restoration
        run: |
          echo "=========================================="
          echo "BUILD INFORMATION"
          echo "=========================================="
          echo "Kernel Version: ${{ env.KERNEL_VERSION }}"
          echo "Release Tag: ${{ env.RELEASE_TAG }}"
          echo "Build Number: #${{ github.run_number }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Release Exists: ${{ steps.check_release.outputs.exists }}"
          echo "Config: acer_sw1_011_defconfig"
          echo ""
          echo "=========================================="
          echo "CACHE RESTORATION STATUS"
          echo "=========================================="
          
          # ccache
          echo "1️⃣  CCACHE:"
          if [ -n "${{ steps.ccache-restore.outputs.cache-matched-key }}" ]; then
            echo "   ✅ RESTORED: ${{ steps.ccache-restore.outputs.cache-matched-key }}"
            if [ -d ~/.ccache ]; then
              SIZE=$(du -sh ~/.ccache 2>/dev/null | cut -f1)
              FILES=$(find ~/.ccache -type f 2>/dev/null | wc -l)
              echo "   📦 Size: $SIZE ($FILES files)"
            fi
          else
            echo "   ❌ NOT FOUND - First build will take ~50 minutes"
          fi
          echo ""
          
          # .config
          echo "2️⃣  KERNEL .CONFIG:"
          if [ "${{ steps.config-restore.outputs.cache-hit }}" == "true" ]; then
            echo "   ✅ RESTORED: Cached .config (preserves timestamps for ccache)"
          else
            echo "   ⚠️  WILL GENERATE: Fresh .config from defconfig"
            echo "   ⚠️  This may invalidate some ccache entries"
          fi
          echo ""
          
          # kernel tools
          echo "3️⃣  KERNEL BUILD TOOLS:"
          if [ -n "${{ steps.kernel-tools-restore.outputs.cache-matched-key }}" ]; then
            echo "   ✅ RESTORED: ${{ steps.kernel-tools-restore.outputs.cache-matched-key }}"
          else
            echo "   ❌ NOT FOUND"
          fi
          echo ""
          
          # Build time prediction
          if [ -n "${{ steps.ccache-restore.outputs.cache-matched-key }}" ] && [ "${{ steps.config-restore.outputs.cache-hit }}" == "true" ]; then
            echo "⚡ CACHE AVAILABLE + CONFIG CACHED - Build should take ~10-15 minutes"
          elif [ -n "${{ steps.ccache-restore.outputs.cache-matched-key }}" ]; then
            echo "⚠️  CACHE AVAILABLE but CONFIG CHANGED - Build may take ~30-40 minutes"
            echo "💡 Next build will be faster with cached config"
          else
            echo "⏰ NO CACHE - Full build will take ~50-60 minutes"
            echo "💡 Subsequent builds will be much faster!"
          fi
          echo "=========================================="

      # ------------------------------------------------------------
      # Configure ccache
      # ------------------------------------------------------------
      - name: Configure ccache
        run: |
          # Configuración optimizada para tmpfs
          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=1
          ccache --set-config=sloppiness=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers
          ccache --set-config=hash_dir=false
          
          # Usar tmpfs también para ccache temp files (más rápido)
          ccache --set-config=temporary_dir=/tmp/kernel-build/ccache-tmp
          mkdir -p /tmp/kernel-build/ccache-tmp
          
          # CRÍTICO: Limpiar stats previos para ver uso real
          ccache --zero-stats
          
          echo "=== Ccache Configuration ==="
          ccache --show-config | grep -E "(max_size|compression|sloppiness|temporary_dir)"
          echo ""
          echo "=== Initial Statistics (zeroed) ==="
          ccache --show-stats
          echo ""
          echo "=== Verifying ccache is working ==="
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          which gcc
          which g++
          gcc --version | head -1

      # ------------------------------------------------------------
      # Prepare kernel configuration
      # ------------------------------------------------------------
      - name: Prepare kernel configuration
        working-directory: kernel-src
        run: |
          echo "🔧 Configuring kernel..."
          
          # Si existe .config cacheado, usarlo
          if [ -f .config ] && [ "${{ steps.config-restore.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Using cached .config (preserves timestamps for ccache)"
            make olddefconfig
          else
            echo "⚙️  Generating fresh config from defconfig"
            
            # Buscar el defconfig personalizado
            if [ -f arch/x86/configs/acer_sw1_011_defconfig ]; then
              echo "✅ Using custom defconfig: acer_sw1_011_defconfig"
              make acer_sw1_011_defconfig
            elif [ -f arch/arm64/configs/acer_sw1_011_defconfig ]; then
              echo "✅ Using custom defconfig: acer_sw1_011_defconfig (ARM64)"
              make acer_sw1_011_defconfig
            else
              echo "❌ ERROR: acer_sw1_011_defconfig not found!"
              echo "Available defconfigs in arch/x86/configs/:"
              ls -1 arch/x86/configs/ | grep defconfig | head -10
              exit 1
            fi
            
            # Optimizaciones para builds más rápidos
            echo ""
            echo "⚙️  Applying build optimizations..."
            
            # Deshabilitar debug info (ahorra ~30% tiempo)
            scripts/config --disable CONFIG_DEBUG_INFO
            scripts/config --disable CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
            scripts/config --disable CONFIG_DEBUG_INFO_DWARF4
            scripts/config --disable CONFIG_DEBUG_INFO_DWARF5
            scripts/config --disable CONFIG_GDB_SCRIPTS
            scripts/config --set-val CONFIG_DEBUG_INFO_NONE y
            
            # Deshabilitar LOCALVERSION automático (nombres limpios)
            scripts/config --disable CONFIG_LOCALVERSION_AUTO
            
            # Optimizaciones adicionales de compilación
            scripts/config --enable CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE
            scripts/config --disable CONFIG_GCOV_KERNEL
            scripts/config --disable CONFIG_KCOV
            
            # CRÍTICO para Clang: Deshabilitar LTO (causa problemas)
            if [ "${{ github.event.inputs.compiler }}" = "clang" ]; then
              echo "⚙️  Disabling LTO for Clang (avoids build issues)..."
              scripts/config --disable CONFIG_LTO_CLANG
              scripts/config --disable CONFIG_LTO_CLANG_THIN
              scripts/config --disable CONFIG_LTO_CLANG_FULL
              scripts/config --disable CONFIG_CFI_CLANG
            fi
            
            make olddefconfig
          fi
          
          echo ""
          echo "=== Configuration summary ==="
          echo "Config used: acer_sw1_011_defconfig"
          echo "Config cached: ${{ steps.config-restore.outputs.cache-hit }}"
          echo "Compiler: ${{ github.event.inputs.compiler || 'gcc' }}"
          echo "Debug info: disabled"
          echo "Localversion auto: disabled"
          echo "Optimization: performance"
          if [ "${{ github.event.inputs.compiler }}" = "clang" ]; then
            echo "LTO: disabled (for stability)"
          fi

      # ------------------------------------------------------------
      # Build kernel .deb packages
      # ------------------------------------------------------------
      - name: Build .deb kernel packages
        working-directory: kernel-src
        run: |
          # Setup ccache
          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          export CC="ccache gcc"
          export CXX="ccache g++"
          
          # Usar mold si está disponible (3-5x más rápido que ld)
          if command -v mold &> /dev/null; then
            export LDFLAGS="-fuse-ld=mold"
            echo "✅ Using mold linker (ultra-fast)"
          fi
          
          # Optimizations for Intel x5-Z8300
          export KCFLAGS="-O2 -march=silvermont -mtune=silvermont -pipe"
          export KCPPFLAGS="-D_FORTIFY_SOURCE=2"
          
          # Deshabilitar generación de documentación y checks innecesarios
          export KDOC_WERROR=0
          export LOCALVERSION=""
          
          # Configurar número óptimo de jobs
          NCPUS=$(nproc)
          JOBS=$((NCPUS + 2))
          
          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="
          echo "Compiler: $(gcc --version | head -1)"
          echo "Ccache: $(ccache --version | head -1)"
          echo "CPU Cores: $NCPUS"
          echo "Parallel Jobs: $JOBS"
          echo "Target Platform: Intel x5-Z8300 (Silvermont)"
          echo "Kernel Version: ${{ env.KERNEL_VERSION }}"
          if command -v mold &> /dev/null; then
            echo "Linker: mold (fast)"
          else
            echo "Linker: ld (default)"
          fi
          echo "=========================================="
          echo ""
          
          START_TIME=$(date +%s)
          
          echo "🔨 Starting kernel compilation..."
          # Build optimizado - deshabilitar verificaciones innecesarias
          make -j$JOBS \
            KERNELRELEASE=${{ env.KERNEL_VERSION }} \
            KDEB_PKGVERSION=${{ env.KERNEL_VERSION }}-1 \
            KDEB_SOURCENAME=linux-custom \
            KDEB_COMPRESS=xz \
            INSTALL_MOD_STRIP=1 \
            CONFIG_SHELL=/bin/bash \
            V=0 \
            bindeb-pkg 2>&1 | tee build.log
          
          END_TIME=$(date +%s)
          BUILD_TIME=$((END_TIME - START_TIME))
          BUILD_MIN=$((BUILD_TIME / 60))
          BUILD_SEC=$((BUILD_TIME % 60))
          
          echo ""
          echo "=========================================="
          echo "✅ BUILD COMPLETED SUCCESSFULLY!"
          echo "=========================================="
          echo "Build Time: ${BUILD_MIN} minutes ${BUILD_SEC} seconds"
          echo "=========================================="
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
          
          echo ""
          echo "📦 Generated .deb packages:"
          ls -lh ../*.deb

      # ------------------------------------------------------------
      # Show ccache statistics
      # ------------------------------------------------------------
      - name: Show ccache statistics
        if: always()
        run: |
          echo "=========================================="
          echo "CCACHE FINAL STATISTICS"
          echo "=========================================="
          ccache --show-stats
          echo ""
          
          # Parse stats de forma más robusta
          STATS=$(ccache --show-stats)
          
          # Intentar extraer hits y misses de diferentes formatos
          # Formato nuevo: "Hits:              12345 / 67890 (18.20%)"
          # Formato viejo: "cache hit (direct)     12345"
          
          CACHE_HITS=$(echo "$STATS" | grep -i "hits:" | grep -oE '[0-9]+' | head -1 || echo "0")
          CACHE_MISS=$(echo "$STATS" | grep -i "misses:" | grep -oE '[0-9]+' | head -1 || echo "0")
          
          # Si no encontró en formato nuevo, intentar formato viejo
          if [ "$CACHE_HITS" = "0" ]; then
            DIRECT=$(echo "$STATS" | grep -iE "(direct|cache hit \(direct\))" | grep -oE '[0-9]+' | head -1 || echo "0")
            PREPROC=$(echo "$STATS" | grep -iE "(preprocessed|cache hit \(preprocessed\))" | grep -oE '[0-9]+' | head -1 || echo "0")
            CACHE_HITS=$((DIRECT + PREPROC))
          fi
          
          if [ "$CACHE_MISS" = "0" ]; then
            CACHE_MISS=$(echo "$STATS" | grep -iE "(cache miss|misses)" | grep -oE '[0-9]+' | head -1 || echo "0")
          fi
          
          TOTAL=$((CACHE_HITS + CACHE_MISS))
          
          echo "📊 Compilation Statistics:"
          echo "   Cache hits: $CACHE_HITS"
          echo "   Cache misses: $CACHE_MISS"
          echo "   Total compilations: $TOTAL"
          
          if [ $TOTAL -gt 0 ]; then
            HIT_RATE=$(awk "BEGIN {printf \"%.1f\", ($CACHE_HITS * 100) / $TOTAL}")
            echo "   Cache hit rate: ${HIT_RATE}%"
            echo ""
            
            if (( $(echo "$HIT_RATE > 80" | bc -l) )); then
              echo "🎉 EXCELLENT! Cache provided massive speed improvement!"
              echo "   Build was ~5x faster than a clean build."
            elif (( $(echo "$HIT_RATE > 50" | bc -l) )); then
              echo "✅ GOOD cache performance."
              echo "   Build was ~3x faster than a clean build."
            elif (( $(echo "$HIT_RATE > 20" | bc -l) )); then
              echo "⚠️  MODERATE cache usage."
              echo "   Build was ~2x faster than a clean build."
            else
              echo "📝 LOW cache usage - this was close to a full rebuild."
              echo "   Next build will be much faster!"
            fi
          else
            echo ""
            echo "⚠️  No compilation statistics available."
            echo "This might be the first build or ccache is not working properly."
          fi
          
          FINAL_SIZE=$(du -sh ~/.ccache 2>/dev/null | cut -f1 || echo "unknown")
          echo ""
          echo "💾 Final cache size: $FINAL_SIZE"
          echo "=========================================="

      # ------------------------------------------------------------
      # Save ccache
      # ------------------------------------------------------------
      - name: Save ccache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: ~/.ccache
          # Agregar timestamp para evitar conflictos
          key: ccache-${{ github.event.inputs.compiler || 'gcc' }}-${{ github.event.inputs.linker || 'mold' }}-${{ runner.os }}-${{ env.KERNEL_MAJOR_MINOR }}-${{ github.run_id }}

      # ------------------------------------------------------------
      # Save kernel build tools
      # ------------------------------------------------------------
      - name: Save kernel build tools
        uses: actions/cache/save@v5
        if: always() && steps.kernel-tools-restore.outputs.cache-hit != 'true'
        with:
          path: |
            kernel-src/scripts/basic/
            kernel-src/scripts/kconfig/
            kernel-src/scripts/mod/
            kernel-src/tools/objtool/
          key: kernel-tools-${{ runner.os }}-${{ env.KERNEL_MAJOR_MINOR }}

      # ------------------------------------------------------------
      # Save .config generado
      # ------------------------------------------------------------
      - name: Save generated .config
        uses: actions/cache/save@v5
        if: always() && steps.config-restore.outputs.cache-hit != 'true'
        with:
          path: kernel-src/.config
          key: config-${{ runner.os }}-${{ env.KERNEL_MAJOR_MINOR }}-${{ hashFiles('kernel-src/arch/x86/configs/acer_sw1_011_defconfig') }}-${{ github.run_id }}

      # ------------------------------------------------------------
      # Save build metrics
      # ------------------------------------------------------------
      - name: Save build metrics
        if: always()
        run: |
          {
            echo "=========================================="
            echo "BUILD METRICS"
            echo "=========================================="
            echo "Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo "Kernel Version: ${{ env.KERNEL_VERSION }}"
            echo "Build Number: #${{ github.run_number }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }}"
            echo "Build Time: ${{ env.BUILD_TIME }} seconds ($((${{ env.BUILD_TIME }} / 60))m $((${{ env.BUILD_TIME }} % 60))s)"
            echo ""
            echo "=== Cache Information ==="
            echo "ccache restored from: ${{ steps.ccache-restore.outputs.cache-matched-key }}"
            echo "tools restored from: ${{ steps.kernel-tools-restore.outputs.cache-matched-key }}"
            echo ""
            echo "=== Ccache Statistics ==="
            ccache --show-stats 2>/dev/null || echo "ccache stats not available"
            echo "=========================================="
          } > build-metrics.txt
          
          echo ""
          echo "🔍 DEBUG: Searching for .deb files..."
          echo "Current directory: $(pwd)"
          echo ""
          echo "In current directory:"
          ls -la *.deb 2>/dev/null || echo "  No .deb files here"
          echo ""
          echo "In /tmp/kernel-build/..:"
          ls -la /tmp/kernel-build/../*.deb 2>/dev/null || echo "  No .deb files here"
          echo ""
          echo "Searching entire /tmp:"
          find /tmp -name "*.deb" -ls 2>/dev/null | head -20 || echo "  No .deb files found"
          echo ""
          echo "Searching workspace:"
          find "$GITHUB_WORKSPACE" -name "*.deb" -ls 2>/dev/null || echo "  No .deb files found"

      # ------------------------------------------------------------
      # Generate CHANGELOG
      # ------------------------------------------------------------
      - name: Generate CHANGELOG
        run: |
          cd kernel-src
          {
            echo "# Linux Kernel ${{ env.KERNEL_VERSION }} - Build Release"
            echo ""
            echo "## Build Information"
            echo ""
            echo "- **Kernel Version:** ${{ env.KERNEL_VERSION }}"
            echo "- **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo "- **Build Time:** $((${{ env.BUILD_TIME }} / 60)) minutes $((${{ env.BUILD_TIME }} % 60)) seconds"
            echo "- **Target Platform:** Intel x5-Z8300 (Silvermont)"
            echo "- **Compiler:** GCC with optimizations (-march=silvermont -mtune=silvermont)"
            echo ""
            echo "## Installation"
            echo ""
            echo "\`\`\`bash"
            echo "# Download all .deb files"
            echo "# Install with:"
            echo "sudo dpkg -i linux-*.deb"
            echo ""
            echo "# Reboot to use the new kernel"
            echo "sudo reboot"
            echo "\`\`\`"
            echo ""
            echo "## Package Contents"
            echo ""
            echo "- \`linux-image-*\` - Kernel image"
            echo "- \`linux-headers-*\` - Kernel headers for module compilation"
            echo "- \`linux-libc-dev-*\` - Kernel headers for userspace"
            echo ""
            echo "## Recent Kernel Changes (Last 30 commits)"
            echo ""
            git log --reverse -n 30 --pretty=format:"- \`%h\` %s (%an, %ar)" || echo "No git history available"
            echo ""
            echo ""
            echo "## Verification"
            echo ""
            echo "All packages are checksummed in \`SHA256SUMS.txt\`. Verify with:"
            echo ""
            echo "\`\`\`bash"
            echo "sha256sum -c SHA256SUMS.txt"
            echo "\`\`\`"
          } > ../CHANGELOG.md

      # ------------------------------------------------------------
      # Collect release files
      # ------------------------------------------------------------
      - name: Collect release files
        run: |
          mkdir -p release
          
          if ls *.deb 1> /dev/null 2>&1; then
            cp *.deb release/
            DEB_COUNT=$(ls *.deb | wc -l)
            echo "✅ Copied $DEB_COUNT .deb package(s)"
          else
            echo "❌ ERROR: No .deb files found!"
            exit 1
          fi
          
          cp CHANGELOG.md release/
          cp build-metrics.txt release/
          
          cd release
          sha256sum *.deb > SHA256SUMS.txt
          
          echo ""
          echo "=========================================="
          echo "RELEASE FILES PREPARED"
          echo "=========================================="
          ls -lh
          echo ""
          echo "📋 Checksums:"
          cat SHA256SUMS.txt
          echo "=========================================="

      # ------------------------------------------------------------
      # Upload artifacts (always, for debugging)
      # ------------------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-${{ env.KERNEL_VERSION }}-build-${{ github.run_number }}
          path: |
            release/*.deb
            release/*.txt
            release/*.md
            kernel-src/build.log
            
      # ------------------------------------------------------------
      # Create or Update GitHub Release
      # ------------------------------------------------------------
      - name: Create or Update GitHub Release
        run: |
          echo "=========================================="
          echo "CREATING RELEASE"
          echo "=========================================="
          echo "Tag: ${{ env.RELEASE_TAG }}"
          echo ""
          
          # Crear release nueva (la vieja ya fue borrada si existía)
          gh release create "${{ env.RELEASE_TAG }}" \
            release/*.deb \
            release/SHA256SUMS.txt \
            release/build-metrics.txt \
            --title "Linux Kernel ${{ env.KERNEL_VERSION }}" \
            --notes-file release/CHANGELOG.md \
            --latest
          
          echo ""
          echo "✅ Release created successfully!"
          echo "=========================================="
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      # ------------------------------------------------------------
      # Summary
      # ------------------------------------------------------------
      - name: Build summary
        if: always()
        run: |
          echo "=========================================="
          echo "🎉 WORKFLOW COMPLETED"
          echo "=========================================="
          echo "Kernel Version: ${{ env.KERNEL_VERSION }}"
          echo "Release Tag: ${{ env.RELEASE_TAG }}"
          echo "Build Time: $((${{ env.BUILD_TIME }} / 60))m $((${{ env.BUILD_TIME }} % 60))s"
          echo ""
          echo "📦 Release URL:"
          echo "https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}"
          echo "=========================================="
