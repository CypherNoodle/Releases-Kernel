name: Build Kernel and Create Release

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: 'Compilador + Linker'
        required: false
        type: choice
        options:
          - gcc-mold
          - gcc-ld
          - clang-lld
        default: gcc-mold
      package_format:
        description: 'Formato de paquete a generar'
        required: false
        type: choice
        options:
          - deb
          - arch
          - ambos
        default: deb
      prerelease:
        description: 'Marcar como pre-release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v6
        with:
          repository: CypherNoodle/linux-Sw1-011
          path: kernel-src
          fetch-depth: 32

      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: /tmp/kernel-build
          key: kernel-build-${{ github.event.inputs.toolchain }}-${{ hashFiles('kernel-src/acer_sw1_011_defconfig') }}
          restore-keys: |
            kernel-build-${{ github.event.inputs.toolchain }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            bc python3-minimal zstd dwarves mold lld clang debhelper dpkg-dev

      - name: Set environment variables
        run: |
          cd kernel-src
          KERNEL_VERSION=$(make kernelversion)
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
          echo "RELEASE_TAG=v$KERNEL_VERSION-$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
          echo "PACKAGE_FORMAT=${{ github.event.inputs.package_format }}" >> $GITHUB_ENV
          
          if [[ "${{ github.event.inputs.toolchain }}" == "gcc-mold" ]]; then
            echo "COMPILER=gcc" >> $GITHUB_ENV
            echo "LINKER=mold" >> $GITHUB_ENV
          elif [[ "${{ github.event.inputs.toolchain }}" == "gcc-ld" ]]; then
            echo "COMPILER=gcc" >> $GITHUB_ENV
            echo "LINKER=ld" >> $GITHUB_ENV
          else
            echo "COMPILER=clang" >> $GITHUB_ENV
            echo "LINKER=lld" >> $GITHUB_ENV
          fi

      - name: Build Kernel
        run: |
          BUILD_DIR="/tmp/kernel-build"
          mkdir -p $BUILD_DIR
          cp kernel-src/acer_sw1_011_defconfig kernel-src/.config
          cd kernel-src
          
          # 1. Preparar configuración
          make O=$BUILD_DIR olddefconfig
          
          # 2. Definir FLAGS de optimización para Silvermont
          # Estas banderas fuerzan al compilador a usar instrucciones específicas del Atom
          SILVERMONT_FLAGS="-march=silvermont -mtune=silvermont -O3 -pipe"
          
          LD_OPT=""
          [[ "$LINKER" == "mold" ]] && LD_OPT="LD=ld.mold"
          [[ "$LINKER" == "lld" ]] && LD_OPT="LD=ld.lld"
          
          echo "🚀 Compilando con optimizaciones Silvermont..."
          
          if [[ "$COMPILER" == "clang" ]]; then
            # Optimización máxima con LLVM para Silvermont
            make O=$BUILD_DIR CC=clang $LD_OPT LLVM=1 LLVM_IAS=1 \
              KCFLAGS="$SILVERMONT_FLAGS" \
              -j$(nproc) bzImage modules
          else
            # Optimización con GCC + Linker seleccionado
            make O=$BUILD_DIR CC=gcc $LD_OPT \
              KCFLAGS="$SILVERMONT_FLAGS" \
              -j$(nproc) bzImage modules
          fi

      - name: Build Packages (DEB & Arch)
        run: |
          KV="${{ env.KERNEL_VERSION }}"
          BUILD_DIR="/tmp/kernel-build"
          STAGING_DIR="$GITHUB_WORKSPACE/pkg-staging"
          PKGOUT="$GITHUB_WORKSPACE/release"
          mkdir -p "$PKGOUT" "$STAGING_DIR/boot"

          cp "$BUILD_DIR/arch/x86/boot/bzImage" "$STAGING_DIR/boot/vmlinuz-linux-acer-sw1-011"
          cp "$BUILD_DIR/System.map" "$STAGING_DIR/boot/System.map-$KV"
          cp "$BUILD_DIR/.config" "$STAGING_DIR/boot/config-$KV"
          
          make -C "$BUILD_DIR" modules_install INSTALL_MOD_PATH="$STAGING_DIR/usr" INSTALL_MOD_STRIP=1 KERNELRELEASE="$KV" -s
          rm -f "$STAGING_DIR/usr/lib/modules/$KV/build" "$STAGING_DIR/usr/lib/modules/$KV/source"

          if [[ "${{ env.PACKAGE_FORMAT }}" == "arch" || "${{ env.PACKAGE_FORMAT }}" == "ambos" ]]; then
            ARCH_STAGING="$GITHUB_WORKSPACE/arch-tmp"
            mkdir -p "$ARCH_STAGING/etc/mkinitcpio.d"
            cp -r "$STAGING_DIR/"* "$ARCH_STAGING/"
            cat <<EOF > "$ARCH_STAGING/etc/mkinitcpio.d/linux-acer-sw1-011.preset"
ALL_config="/etc/mkinitcpio.conf"
ALL_kver="/boot/vmlinuz-linux-acer-sw1-011"
PRESETS=('default' 'fallback')
default_image="/boot/initramfs-linux-acer-sw1-011.img"
fallback_image="/boot/initramfs-linux-acer-sw1-011-fallback.img"
fallback_options="-S autodetect"
EOF
            mkdir -p "$ARCH_STAGING/usr/share/libalpm/hooks"
            cat <<EOF > "$ARCH_STAGING/usr/share/libalpm/hooks/95-linux-acer-sw1-011.hook"
[Trigger]
Operation = Install
Operation = Upgrade
Type = Package
Target = linux-acer-sw1-011
[Action]
Description = Generando initramfs para linux-acer-sw1-011...
When = PostTransaction
Exec = /usr/bin/mkinitcpio -p linux-acer-sw1-011
EOF
            cd "$ARCH_STAGING"
            {
              echo "pkgname = linux-acer-sw1-011"
              echo "pkgver = $KV"
              echo "pkgrel = 1"
              echo "pkgdesc = Kernel optimizado Silvermont para Acer SW1-011"
              echo "arch = x86_64"
              echo "license = GPL2"
              echo "depend = coreutils"
              echo "depend = kmod"
              echo "depend = mkinitcpio"
              echo "provides = linux=$KV"
            } > .PKGINFO
            tar -I 'zstd -19 -T0' -cf "$PKGOUT/linux-acer-sw1-011-$KV-1-x86_64.pkg.tar.zst" .PKGINFO etc usr boot
          fi

          if [[ "${{ env.PACKAGE_FORMAT }}" == "deb" || "${{ env.PACKAGE_FORMAT }}" == "ambos" ]]; then
            DEB_STAGING="$GITHUB_WORKSPACE/deb-tmp"
            mkdir -p "$DEB_STAGING/DEBIAN"
            cp -r "$STAGING_DIR/boot" "$DEB_STAGING/"
            cp -r "$STAGING_DIR/usr" "$DEB_STAGING/"
            cat <<EOF > "$DEB_STAGING/DEBIAN/control"
Package: linux-acer-sw1-011
Version: $KV
Section: kernel
Priority: optional
Architecture: amd64
Maintainer: ${{ github.repository_owner }}
Description: Kernel optimizado Silvermont para Acer One 10
EOF
            cat <<EOF > "$DEB_STAGING/DEBIAN/postinst"
#!/bin/bash
update-initramfs -c -k $KV
update-grub
EOF
            chmod 755 "$DEB_STAGING/DEBIAN/postinst"
            dpkg-deb --build "$DEB_STAGING" "$PKGOUT/linux-acer-sw1-011-$KV.deb"
          fi

      - name: Generate Checksums and Changelog
        run: |
          cd "$GITHUB_WORKSPACE/release"
          sha256sum * > SHA256SUMS
          {
            echo "## Cambios en esta versión"
            echo "- Kernel: ${{ env.KERNEL_VERSION }}"
            echo "- Toolchain: ${{ env.COMPILER }} con ${{ env.LINKER }}"
            echo "- Optimización: Silvermont (-march=silvermont -O3)"
            echo "### Sumas de verificación SHA256"
            echo "\`\`\`"
            cat SHA256SUMS
            echo "\`\`\`"
          } > CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release/CHANGELOG.md
          files: |
            release/*.deb
            release/*.pkg.tar.zst
            release/SHA256SUMS
          prerelease: ${{ github.event.inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
