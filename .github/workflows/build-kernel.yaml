name: Build Kernel and Create Release

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: 'Compilador + Linker'
        required: false
        type: choice
        options:
          - gcc-mold
          - gcc-ld
          - clang-lld
        default: gcc-mold
      package_format:
        description: 'Formato de paquete a generar'
        required: false
        type: choice
        options:
          - deb
          - arch
          - ambos
        default: deb
      prerelease:
        description: 'Marcar como pre-release'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v6
        with:
          repository: CypherNoodle/linux-Sw1-011
          path: kernel-src
          fetch-depth: 32

      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: /tmp/kernel-build
          key: kernel-build-${{ github.event.inputs.toolchain }}-${{ hashFiles('kernel-src/acer_sw1_011_defconfig') }}
          restore-keys: |
            kernel-build-${{ github.event.inputs.toolchain }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev \
            bc python3-minimal zstd dwarves mold lld clang debhelper dpkg-dev

      - name: Set environment variables
        run: |
          cd kernel-src
          KERNEL_VERSION=$(make kernelversion)
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
          echo "RELEASE_TAG=v$KERNEL_VERSION-$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV
          echo "PACKAGE_FORMAT=${{ github.event.inputs.package_format }}" >> $GITHUB_ENV
          
          if [[ "${{ github.event.inputs.toolchain }}" == "gcc-mold" ]]; then
            echo "COMPILER=gcc" >> $GITHUB_ENV
            echo "LINKER=mold" >> $GITHUB_ENV
          elif [[ "${{ github.event.inputs.toolchain }}" == "gcc-ld" ]]; then
            echo "COMPILER=gcc" >> $GITHUB_ENV
            echo "LINKER=ld" >> $GITHUB_ENV
          else
            echo "COMPILER=clang" >> $GITHUB_ENV
            echo "LINKER=lld" >> $GITHUB_ENV
          fi

      - name: Build Kernel
        run: |
          BUILD_DIR="/tmp/kernel-build"
          mkdir -p $BUILD_DIR
          cp kernel-src/acer_sw1_011_defconfig kernel-src/.config
          cd kernel-src
          
          make O=$BUILD_DIR olddefconfig
          
          # Optimizaciones Silvermont
          SILVERMONT_FLAGS="-march=silvermont -mtune=silvermont -O3 -pipe"
          
          LD_OPT=""
          [[ "$LINKER" == "mold" ]] && LD_OPT="LD=ld.mold"
          [[ "$LINKER" == "lld" ]] && LD_OPT="LD=ld.lld"
          
          if [[ "$COMPILER" == "clang" ]]; then
            make O=$BUILD_DIR CC=clang $LD_OPT LLVM=1 LLVM_IAS=1 KCFLAGS="$SILVERMONT_FLAGS" -j$(nproc) bzImage modules
          else
            make O=$BUILD_DIR CC=gcc $LD_OPT KCFLAGS="$SILVERMONT_FLAGS" -j$(nproc) bzImage modules
          fi

      - name: Build Packages (DEB & Arch)
        run: |
          KV="${{ env.KERNEL_VERSION }}"
          BUILD_DIR="/tmp/kernel-build"
          STAGING_DIR="$GITHUB_WORKSPACE/pkg-staging"
          PKGOUT="$GITHUB_WORKSPACE/release"
          mkdir -p "$PKGOUT" "$STAGING_DIR/boot"

          cp "$BUILD_DIR/arch/x86/boot/bzImage" "$STAGING_DIR/boot/vmlinuz-linux-acer-sw1-011"
          cp "$BUILD_DIR/System.map" "$STAGING_DIR/boot/System.map-$KV"
          cp "$BUILD_DIR/.config" "$STAGING_DIR/boot/config-$KV"
          
          make -C "$BUILD_DIR" modules_install INSTALL_MOD_PATH="$STAGING_DIR/usr" INSTALL_MOD_STRIP=1 KERNELRELEASE="$KV" -s
          rm -f "$STAGING_DIR/usr/lib/modules/$KV/build" "$STAGING_DIR/usr/lib/modules/$KV/source"

          # --- ARCH LINUX (SIN EOF PARA EVITAR ERRORES DE IDENTACIÓN) ---
          if [[ "${{ env.PACKAGE_FORMAT }}" == "arch" || "${{ env.PACKAGE_FORMAT }}" == "ambos" ]]; then
            ARCH_STAGING="$GITHUB_WORKSPACE/arch-tmp"
            mkdir -p "$ARCH_STAGING/etc/mkinitcpio.d"
            cp -r "$STAGING_DIR/"* "$ARCH_STAGING/"
            
            # Escribir Preset usando printf
            printf 'ALL_config="/etc/mkinitcpio.conf"\nALL_kver="/boot/vmlinuz-linux-acer-sw1-011"\nPRESETS=("default" "fallback")\ndefault_image="/boot/initramfs-linux-acer-sw1-011.img"\nfallback_image="/boot/initramfs-linux-acer-sw1-011-fallback.img"\nfallback_options="-S autodetect"\n' > "$ARCH_STAGING/etc/mkinitcpio.d/linux-acer-sw1-011.preset"

            # Escribir Hook usando printf
            mkdir -p "$ARCH_STAGING/usr/share/libalpm/hooks"
            printf '[Trigger]\nOperation = Install\nOperation = Upgrade\nType = Package\nTarget = linux-acer-sw1-011\n\n[Action]\nDescription = Generando initramfs para linux-acer-sw1-011...\nWhen = PostTransaction\nExec = /usr/bin/mkinitcpio -p linux-acer-sw1-011\n' > "$ARCH_STAGING/usr/share/libalpm/hooks/95-linux-acer-sw1-011.hook"

            # Escribir PKGINFO
            cd "$ARCH_STAGING"
            printf 'pkgname = linux-acer-sw1-011\npkgver = %s\npkgrel = 1\npkgdesc = Kernel Silvermont para Acer SW1-011\narch = x86_64\nlicense = GPL2\ndepend = coreutils\ndepend = kmod\ndepend = mkinitcpio\nprovides = linux=%s\n' "$KV" "$KV" > .PKGINFO
            
            tar -I 'zstd -19 -T0' -cf "$PKGOUT/linux-acer-sw1-011-$KV-1-x86_64.pkg.tar.zst" .PKGINFO etc usr boot
          fi

          # --- DEBIAN (SIN EOF) ---
          if [[ "${{ env.PACKAGE_FORMAT }}" == "deb" || "${{ env.PACKAGE_FORMAT }}" == "ambos" ]]; then
            DEB_STAGING="$GITHUB_WORKSPACE/deb-tmp"
            mkdir -p "$DEB_STAGING/DEBIAN"
            cp -r "$STAGING_DIR/boot" "$DEB_STAGING/"
            cp -r "$STAGING_DIR/usr" "$DEB_STAGING/"
            
            printf 'Package: linux-acer-sw1-011\nVersion: %s\nSection: kernel\nPriority: optional\nArchitecture: amd64\nMaintainer: %s\nDescription: Kernel optimizado para Acer One 10\n' "$KV" "${{ github.repository_owner }}" > "$DEB_STAGING/DEBIAN/control"
            printf '#!/bin/bash\nupdate-initramfs -c -k %s\nupdate-grub\n' "$KV" > "$DEB_STAGING/DEBIAN/postinst"
            
            chmod 755 "$DEB_STAGING/DEBIAN/postinst"
            dpkg-deb --build "$DEB_STAGING" "$PKGOUT/linux-acer-sw1-011-$KV.deb"
          fi

      - name: Generate Checksums and Changelog
        run: |
          cd "$GITHUB_WORKSPACE/release"
          sha256sum * > SHA256SUMS
          printf '## Cambios en esta versión\n- Kernel: %s\n- Toolchain: %s con %s\n- Optimización: Silvermont\n### Sumas SHA256\n```\n' "${{ env.KERNEL_VERSION }}" "${{ env.COMPILER }}" "${{ env.LINKER }}" > CHANGELOG.md
          cat SHA256SUMS >> CHANGELOG.md
          printf '```\n' >> CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release/CHANGELOG.md
          files: release/*
          prerelease: ${{ github.event.inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
